name: Expand source tree

on:
  push:
    branches: [main]
    paths:
      - source-tree.tar.gz
      - .github/workflows/expand-source-tree.yml

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand and commit source tree
        shell: bash
        run: |
          tar -xzf source-tree.tar.gz
          rm -f source-tree.tar.gz ego-id-game-backup.tar.gz
          rm -f .github/workflows/expand-source-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand Ego & ID source tree"
          git push

